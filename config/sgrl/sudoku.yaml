# Starting configuration, not a tuned or benchmarked recipe.
data_path: data/sudoku-extreme-1k-aug-1000
output_dir: runs/sgrl-sudoku-base
stage: base
device: cuda
seed: 0
batch_size: 8
steps: 10000
epochs_per_iter: 16
learning_rate: 0.0001
weight_decay: 0.001
ema_decay: 0.999
save_every: 100
eval_every: 0
eval_loops: 1000
model:
  hidden_size: 512
  num_heads: 8
  expansion: 4
  puzzle_emb_ndim: 512
  puzzle_emb_len: 16
  forward_dtype: float32
  activation_checkpointing: true
  init_std: 6.0
recovery:
  loops: 72
  terminal_window: 2
  anchor_min: 12
  anchor_max: 36
  bridge_steps: 4
  max_anchors: 2
  teacher_restarts: 2
  teacher_steps: 16
  learning_rate: 0.0001
